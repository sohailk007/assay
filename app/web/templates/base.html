<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Assay{% endblock %}</title>
<style>
  :root {
    --ink: #1c1c1a; --muted: #5f5e5a; --line: #dddbd3; --bg: #faf9f6;
    --card: #ffffff; --hold: #854f0b; --holdbg: #faeeda;
    --ok: #0f6e56; --okbg: #e1f5ee; --stop: #a32d2d; --stopbg2: #fcebeb;
    --accent: #185fa5; --accentbg: #e6f1fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 24px; display: flex; align-items: baseline; gap: 20px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 500; margin: 0; }
  header .warn { color: var(--hold); font-size: 13px; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px; }
  a { color: var(--accent); }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; font-weight: 500; margin: 0 0 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 20px;
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .pill.hold { background: var(--holdbg); color: var(--hold); }
  .pill.ok { background: var(--okbg); color: var(--ok); }
  .pill.stop { background: var(--stopbg2); color: var(--stop); }
  .pill.neutral { background: #f1efe8; color: var(--muted); }
  .stats { display: flex; gap: 26px; flex-wrap: wrap; }
  .stat .n { font-size: 24px; font-weight: 500; display: block; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  .reason { font-size: 13px; color: var(--hold); }
  label.check { display: block; padding: 4px 0; font-size: 14px; }
  input[type=text], select, textarea {
    font: inherit; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 6px; width: 100%; background: #fff;
  }
  button {
    font: inherit; font-weight: 500; padding: 8px 16px; border-radius: 6px;
    border: 1px solid var(--line); background: #fff; cursor: pointer;
  }
  button.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.danger { background: #fff; border-color: var(--stop); color: var(--stop); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  .err { background: var(--stopbg2); color: var(--stop); padding: 10px 14px;
         border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .field-row { margin-bottom: 12px; }
  .field-row span { display:block; font-size: 12px; color: var(--muted); }
  code { font-size: 13px; background: #f1efe8; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1><a href="/" style="text-decoration:none;color:inherit">Assay <span style="font-weight:400;color:var(--muted)">TrainifyHub lead validation</span></a></h1>
  <span class="warn">Evidence, not permission. Nothing is contactable until a named person approves it here.</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
